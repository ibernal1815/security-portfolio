# nginx.conf — security header block for self-hosted deployments
# Add this server block (or merge the header directives into your existing one).
# Tested on Nginx 1.18+.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name yourdomain.com www.yourdomain.com;

    root /var/www/portfolio;
    index index.html;

    # ── TLS ────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── SECURITY HEADERS ───────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-Frame-Options           "DENY"                          always;
    add_header Referrer-Policy           "no-referrer"                   always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy — see _headers for full breakdown of each directive
    add_header Content-Security-Policy "
        default-src 'none';
        script-src  'self';
        style-src   'self' https://fonts.googleapis.com;
        font-src    https://fonts.gstatic.com;
        img-src     'self' data:;
        connect-src 'none';
        frame-src   'none';
        object-src  'none';
        base-uri    'self';
        form-action 'none';
    " always;

    # ── STATIC ASSET CACHING ───────────────────────────────────────────────
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location ~* \.(woff2|woff|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ── HTML — no caching so header changes apply immediately ──────────────
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}
